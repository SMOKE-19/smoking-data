yaml:
  schema_version: smoking-data.pipeline.v8
  asset_code: "0401"

job:
  name: analysis_snapshot_0401

output:
  artifact:
    type: analysis_snapshot
    root_dir: f"{data_root}/{asset_code}/{job_name}"
    format: sbdf
    sbdf:
      row_key_columns: [partition, join_key, right_value_a]
      batch_size: 50000
      encoding_rle: true
    physical_layout:
      profile: analysis_snapshot_adaptive_v1
      adaptation_scope: task_adaptive
      row_group_rows: 1000
  logging:
    root_dir: f"{log_root}/{asset_code}"

define_upstream:
- op: define_asset
  alias: joined_metrics
  definition: 0301.pipeline_multi_right_join.0301.yaml
# 외부 dataset을 작업 대상으로 지정하려면 위 define_asset 블록을 주석 처리하고 아래를 활성화한다.
# - op: define_dataset
#   alias: joined_metrics
#   paths: [DATA/input/analysis/joined_metrics]
#   format: parquet
#   union_by_name: true
#   missing_columns: insert_null
#   incompatible_dtypes: error

build_sidecar:
  alias: select_snapshot_rows
  source: joined_metrics
  columns: auto
  part_boundary:
    target_rows: 20000
    target_key_groups: 500
    preserve_groups: [partition, join_key, right_value_a, metric_name]

# 선택된 coordinate payload만 읽어 최종 분석 축을 완결하고 snapshot.sbdf로 원자적 커밋한다.
materialize:
  alias: materialize_snapshot_input
  workers: 1
  max_tasks_per_child: 1
  operations:
  # columns를 생략하면 입력 스키마의 모든 LIST/LargeList 칼럼을 자동 탐색해 strict zip한다.
  # - op: unnest
  #   alias: explode_all_list_columns
  #   max_elements_per_row: 1024
  - op: include_columns
    alias: select_snapshot_columns
    columns:
    - partition
    - join_key
    - right_value_a
    - metric_name
    - metric_value
    - latest_updated_at.max

  - op: pivot
    alias: pivot_analysis_metrics
    row_keys: [partition, join_key, right_value_a]
    column_keys: [metric_name]
    value_keys:
    - name: value
      source_column: metric_value
      aggregation: first
      column_name_rule: <column_key_value>__<value_key_name>
    value_keys_without_column:
    - name: latest_updated_at
      source_column: latest_updated_at.max
      aggregation: max
      column_name_rule: <value_key_name>.<agg>
    first_duplicate_policy: error
    null_column_key_policy: error
    column_key_separator: __

execution:
  memory_budget_mb: 4096
  max_source_files_per_task: 40
  reset_before_run: false
