yaml:
  schema_version: smoking-data.pipeline.v7
  asset_code: "0201"

job:
  name: parity_pivot

output:
  artifact:
    type: curated_dataset
    root_dir: DATA/parity/curated/output
    format: parquet
    compression: zstd
    write_policy: atomic_replace
    physical_layout:
      profile: curated_reuse_v1
      adaptation_scope: generation_fixed
      row_group_rows: auto
  logging:
    root_dir: f"{log_root}/{asset_code}"

define_upstream:
- op: define_dataset
  alias: main
  paths: [DATA/parity/curated/input]
  format: parquet
  union_by_name: true
  missing_columns: insert_null
  incompatible_dtypes: error
# smoking-data 관리 Asset을 작업 대상으로 지정하려면 위 define_dataset 블록을 주석 처리하고 아래를 활성화한다.
# - op: define_asset
#   alias: main
#   definition: 0101.source.0101.yaml

build_sidecar:
  alias: select_all_rows
  source: main
  columns: auto
  operations:
  - op: active_row_selection
    method: sort_first
    group_keys:
    - name: partition
      column: partition
    - name: row_key
      column: row_key
    - name: metric
      column: metric
    sort:
    - column: updated_at
      direction: desc
      nulls: last

materialize:
  alias: materialize_pivot_payload
  source: main
  coordinates: select_all_rows
  partition_by: [partition]
  part_boundary:
    target_rows: 2
    preserve_groups: [partition, row_key, metric]
  workers: 1
  max_tasks_per_child: 1
  operations:
  - op: include_columns
    alias: select_pivot_payload
    columns: [partition, row_key, metric, amount, updated_at]
  - op: pivot
    alias: pivot_metrics
    row_keys: [partition, row_key]
    column_keys: [metric]
    value_keys:
    - name: amount_total
      source_column: amount
      aggregation: sum
      output_dtype: INT64
      column_name_rule: <column_key_value>__<value_key_name>
    value_keys_without_column:
    - name: latest_updated_at
      source_column: updated_at
      aggregation: max
      output_dtype: INT64
      column_name_rule: <value_key_name>.<agg>
    first_duplicate_policy: error
    null_column_key_policy: label

save_dataset:
  alias: write_pivot
  input: materialize_pivot_payload
  partition_by: [partition]
  operations: []

execution:
  memory:
    hard_limit_mb: 4096
    safety_ratio: 0.80
    phases:
      build_sidecar:
        target_peak_memory_mb: 1536
        workers: {min: 1, max: 2}
      materialize:
        target_peak_memory_mb: 3584
        workers: {min: 1, max: 2}
      save_dataset:
        target_peak_memory_mb: 512
        workers: {min: 1, max: 1}
  reset_before_run: true
  # probe·candidate·active sidecar와 physical plan은 전체 입력으로 만들고 최종 task만 제한한다.
  # 같은 root_dir의 전체 결과를 부분 dataset으로 대체하므로 테스트 전용 경로 사용을 권장한다.
  # test_run:
  #   final_task_limit: 1
