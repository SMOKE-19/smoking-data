yaml:
  schema_version: smoking-data.schedule.v1

schedule:
  alias: source_curated_every_30m
  enabled: true
  timezone: Asia/Seoul
  cron: "0,30 7-23 * * *"

targets:
  - alias: source
    kind: asset
    definition: ../templates/0101.source.0101.yaml
  - alias: curated
    kind: asset
    definition: ../templates/0201.pipeline_curated_pivot.0201.yaml

policy:
  misfire: catch_up_once
  timeout_minutes: 180
