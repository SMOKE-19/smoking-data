config:
  schema_version: smoking-data.asset-config.v3
  scope: "0101"

paths:
  asset_data_root: f"{data_root}/{asset_code}"
  asset_log_root: f"{log_root}/{asset_code}"

execution:
  write_source_profile_json: false
  retryable_error_substrings: []
  data_api_print_capture:
    rules:
      enabled: false
      fields:
      - field: api_print_full_text
        enabled: true
        capture: full_text
      - field: api_execution_time_sec
        enabled: true
        capture: regex
        regex: '(?im)>>time:\s*(?:(\d+)\s*min\s+)?([0-9]+(?:\.[0-9]+)?)s'
      - field: api_rows
        enabled: true
        capture: regex
        regex: '(?im)(?:rows:\s*|the\s+total\s+number\s+of\s+rows\s+in\s+exported\s+output:\s*)([0-9]+)'
      - field: api_dataset_parts
        enabled: true
        capture: regex
        regex: '(?im)count\s+of\s+output:\s*([0-9]+)'
  warmup_first_task: false
  worker_start_delay_sec: 5.0
  max_retries: 5
  retry_backoff_sec: 1.0

output:
  artifact:
    type: source_dataset
    root_dir: f"{asset_data_root}/{table_id}_{job_name}"
    format: parquet
    compression: zstd
    physical_layout:
      profile: source_ingest_v1
      adaptation_scope: generation_fixed
      row_group_rows: 1000
    file_name_rule:
      raw_dataset: f"{job_name}__<date_from>-<date_to>"
    parquet_writer:
      index: false
      engine: pyarrow
      write_page_index: true
      write_statistics: true
      data_page_size: 1048576
      max_rows_per_page: 1000
      use_dictionary: false
  logging:
    root_dir: f"{asset_log_root}/{table_id}"
    file_name_rule:
      logging: f"{job_name}.jsonl"
