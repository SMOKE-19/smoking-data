yaml:
  schema_version: smoking-data.schedule.v1

schedule:
  alias: csv_source_daily
  enabled: false
  timezone: Asia/Seoul
  cron: "0 3 * * *"

targets:
  - alias: csv_source
    kind: asset
    definition: ../templates/0103.csv_unpivot_source.0103.yaml

policy:
  misfire: catch_up_once
  timeout_minutes: 180
