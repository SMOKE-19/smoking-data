yaml:
  schema_version: smoking-data.csv-source.v1
  asset_code: "0103"
job:
  id: csv-http-001
  name: public_download_zip
source:
  transport: http_download
  download:
    url: https://example.go.kr/download/data.zip
    query:
      serviceKey: ${DATA_GO_KR_SERVICE_KEY}
    timeout_sec: 60
    format: zip
    file_name: public_data.zip
    max_download_bytes: 1073741824
    max_archive_members: 10000
    max_extracted_bytes: 4294967296
  glob: "**/*.csv"
  recursive: true
  ordering: path_asc
  empty_directory_policy: error
  csv:
    encoding: utf8
    delimiter: ","
    quote_char: '"'
    header: true
    null_values: ["", "NULL"]
    malformed_row_policy: error
  source_file:
    output_column: file_name
    value: relative_path
    dtype: STRING
    existing_column_policy: replace_with_warning
materialize:
  operations:
  - op: type_cast
    alias: typed_csv
    load_as: STRING
    columns_by_type:
      STRING: [row_key1, row_key2]
      FLOAT64: [x, y]
      DATETIME: [time]
    default_type: FLOAT64
    cast_failure_policy: error
    missing_named_column_policy: error
  - op: unpivot
    alias: unpivoted
    id_columns: [row_key1, row_key2, x, y, time, file_name]
    value_columns: remaining
    name_column: category
    value_column: value
    value_type: FLOAT64
    preserve_nulls: false
  - op: add_calc
    alias: calculated
    expressions:
    - name: route_key
      sql: "concat(file_name, '__', category)"
routing:
  input: calculated
  routes:
  - route_name: all_rows
    filtering:
    - sql: "category IS NOT NULL"
  overlap_policy: duplicate
  unmatched_policy: drop
output: {}
execution:
  target_rows_per_part: 100000
