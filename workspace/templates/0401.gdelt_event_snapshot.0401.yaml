yaml:
  schema_version: smoking-data.pipeline.v8
  asset_code: "0401"
job:
  name: gdelt_event_snapshot
output:
  artifact:
    type: analysis_snapshot
    root_dir: f"{data_root}/{asset_code}/{job_name}"
    format: sbdf
    sbdf: {row_key_columns: [partition, row_key], batch_size: 50000, encoding_rle: true}
    physical_layout: {profile: analysis_snapshot_adaptive_v1, adaptation_scope: task_adaptive, row_group_rows: auto}
  logging:
    root_dir: f"{log_root}/{asset_code}"
define_upstream:
- op: define_asset
  alias: enriched_events
  definition: 0301.gdelt_event_enriched.0301.yaml

build_sidecar:
  alias: select_latest_event_rows
  source: enriched_events
  columns: auto
  part_boundary:
    target_rows: 20000
    target_key_groups: 500
    preserve_groups: [partition, row_key, category]

materialize:
  alias: materialize_snapshot
  workers: 1
  max_tasks_per_child: 1
  operations:
  # columns를 생략하면 입력 스키마의 모든 LIST/LargeList 칼럼을 자동 탐색해 strict zip한다.
  # - op: unnest
  #   alias: explode_all_list_columns
  #   max_elements_per_row: 1024
  - op: include_columns
    alias: snapshot_columns
    columns: [partition, row_key, join_key, updated_at, category, value, SOURCEURL, file_name]
execution:
  memory_budget_mb: 2048
  max_source_files_per_task: 40
  reset_before_run: false
