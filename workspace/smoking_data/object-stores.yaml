# Object-store target에는 비밀 값을 기록하지 않습니다.
# AWS shared profile은 Linux ~/.aws 또는 Windows %USERPROFILE%\.aws에서
# AWS SDK가 읽습니다. init은 해당 폴더나 credential 파일을 만들지 않습니다.
object_stores:
  analytics_s3:
    type: s3
    bucket: replace-with-your-bucket
    base_prefix: smoking-data
    region: ap-northeast-2
    endpoint_url_env: SMOKING_DATA_S3_ENDPOINT
    credentials:
      provider: shared_profile
      profile: default
      shared_files: os_default
    path_style: false
    multipart:
      # Large objects use bounded parallel range transfer; small objects stay single-request.
      threshold_bytes: 67108864
      chunk_bytes: 16777216
      concurrency: 8
    # server_side_encryption:
    #   mode: aws:kms
    #   kms_key_id_env: SMOKING_DATA_S3_KMS_KEY_ID
