yaml:
  schema_version: smoking-data.pipeline.v6
  asset_code: "0301"

job:
  name: multi_right_join

output:
  artifact:
    type: joined_dataset
    root_dir: f"{data_root}/{asset_code}/{job_name}"
    format: parquet
    compression: zstd
    physical_layout:
      profile: joined_reuse_v1
      adaptation_scope: generation_fixed
      row_group_rows: auto
  logging:
    root_dir: f"{log_root}/{asset_code}"

define_upstream:
- op: define_asset
  alias: main
  definition: 0201.pipeline_curated_pivot.0201.yaml
# 외부 dataset이면 위 define_asset을 주석 처리하고 아래를 활성화한다.
# - op: define_dataset
#   alias: main
#   paths: [DATA/input/join/main]
#   format: parquet
#   union_by_name: true

- op: define_dataset
  alias: profile
  paths: [DATA/input/join/right_profile]
  format: parquet
  union_by_name: true
# 관리형 upstream이면 위 define_dataset을 주석 처리하고 아래를 활성화한다.
# - op: define_asset
#   alias: profile
#   definition: 0201.profile.0201.yaml

- op: define_dataset
  alias: category
  paths: [DATA/input/join/right_category]
  format: parquet
  union_by_name: true
# 관리형 upstream이면 위 define_dataset을 주석 처리하고 아래를 활성화한다.
# - op: define_asset
#   alias: category
#   definition: 0201.category.0201.yaml

build_sidecar:
  alias: join_keyspace
  method: union_distinct_keys
  sources: [main]
  keys: [partition, join_key]
  partition_by: [partition]
  part_boundary:
    target_rows: 20000
    target_key_groups: 500
    preserve_groups: [partition, join_key]

materialize:
  alias: materialize_left_parts
  workers: 1
  max_tasks_per_child: 4
  operations:

  - op: join
    alias: join_main
    input_right: main
    left_on: [partition, join_key]
    right_on: [partition, join_key]

  - op: join
    alias: join_profile
    input_right: profile
    left_on: [join_key]
    right_on: [join_key]
    include_columns: [partition, join_key, latest_updated_at.max, profile_code, profile_name]

  - op: join
    alias: join_category
    input_right: category
    left_on: [profile_code]
    right_on: [category_profile_code]
    include_columns: '^category_'
    exclude_columns: [debug]

execution:
  memory_budget_mb: 4096
  max_source_files_per_task: 40
  reset_before_run: false
  # left/right index와 physical plan은 전체 입력으로 만들고 최종 join task만 제한한다.
  # 같은 root_dir의 전체 결과를 부분 dataset으로 대체하므로 테스트 전용 경로 사용을 권장한다.
  # test_run:
  #   final_task_limit: 1
