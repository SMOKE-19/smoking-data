version: 1

# 0101 Source API adapter 설정
#
# 이 파일은 query_mode가 structured 또는 sql_file일 때만 사용합니다.
# http_json/http_ndjson/http_xml은 Definition YAML의 source.api_request.http를 사용하는
# 내장 HTTP GET transport이므로 아래 Python SPI 설정을 읽지 않습니다.
#
# 현재 SPI adapter가 감싸는 호출 형태는 다음과 같습니다.
#
#   import server_api as spi
#   decorated_call = spi.spiSpecialDeco(
#       spi.callData,
#       pandas.DataFrame.to_parquet,
#       output_file,
#       **parquet_writer_options,
#   )
#   result = decorated_call(
#       sql_text,
#       internal_option1=True,
#       internal_option2=True,
#   )
#
# 현재 source_api.py는 위 코드를 아래 키로 조립합니다.
#
#   module             -> import_module(module)
#   query_function     -> getattr(imported_module, query_function)
#   decorator_function -> getattr(imported_module, decorator_function)
#   call_options       -> decorated_call(sql_text, **call_options)
#
# decorator에는 다음 인자가 순서대로 전달됩니다.
#
#   decorator_function(
#       query_function,
#       pandas.DataFrame.to_parquet,
#       output_file,
#       **output.artifact.parquet_writer,
#   )
#
# 실제 환경의 라이브러리명이나 함수명이 다르면 아래 값만 수정하면 됩니다.
# Parquet 옵션은 각 0101 YAML의 output.artifact.parquet_writer에서 관리합니다.
# 인증정보는 실제 값을 쓰지 말고 "${ENVIRONMENT_VARIABLE}" 형태로 참조하세요.
# 토큰 파일을 갱신해야 하는 SPI는 Definition YAML의 source.api_request.spi에
# 프로젝트 루트 기준 상대경로를 지정합니다. 스크립트 표준출력·표준에러와 토큰 값은
# Smoking Data가 읽거나 기록하지 않으며, 실행당 한 번 query 전에 별도 프로세스로 실행합니다.
#
#   spi:
#     pre_query_script: auth/generate_token.py
#     execution: once_per_run
#     timeout_sec: 60
#     lock_timeout_sec: 60
default_adapter: source_spi

adapters:
  source_spi:
    # Python에서 import할 API 라이브러리명
    module: server_api

    # 원본 SQL 문자열을 받아 데이터를 반환하는 API 함수명
    query_function: callData

    # query 함수와 pandas.to_parquet를 결합해 저장 함수를 만드는 decorator 함수명
    decorator_function: spiSpecialDeco

    # decorator가 반환한 함수에 SQL과 함께 전달할 keyword arguments
    call_options:
      internal_option1: true
      internal_option2: true
