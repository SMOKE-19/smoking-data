config:
  schema_version: smoking-data.asset-config.v3
  scope: "0201"

paths:
  asset_data_root: f"{data_root}/{asset_code}"
  asset_log_root: f"{log_root}/{asset_code}"

output:
  artifact:
    type: curated_dataset
    root_dir: f"{asset_data_root}/{job_name}"
    format: parquet
    compression: zstd
    physical_layout:
      profile: curated_reuse_v1
      adaptation_scope: generation_fixed
      row_group_rows: auto
    publication:
      parquet:
        enabled: true
        random_access_index:
          level: key
          key_columns: [bucket, text_ro, int_wa]
  logging:
    root_dir: f"{asset_log_root}"
