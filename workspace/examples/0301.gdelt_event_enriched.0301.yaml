yaml:
  schema_version: smoking-data.pipeline.v6
  asset_code: "0301"
job:
  name: gdelt_event_enriched
output:
  artifact:
    type: joined_dataset
    root_dir: f"{data_root}/{asset_code}/{job_name}"
    format: parquet
    compression: zstd
    write_policy: atomic_replace
    physical_layout: {profile: joined_reuse_v1, adaptation_scope: generation_fixed, row_group_rows: auto}
  logging:
    root_dir: f"{log_root}/{asset_code}"
operations:
- op: define_asset
  alias: main
  definition: 0201.gdelt_event_truth.0201.yaml
- op: materialize
  alias: materialize_events
  inputs: {source: main}
  partition_by: [partition]
  part_boundary:
    target_rows: 20000
    target_key_groups: 5000
    preserve_groups: [partition, row_key]
  workers: 1
  max_tasks_per_child: 1
- op: save_dataset
  alias: save_enriched
  inputs: {data: materialize_events}
  partition_by: [partition]
execution:
  memory_budget_mb: 2048
  max_source_files_per_task: 40
  reset_before_run: false
