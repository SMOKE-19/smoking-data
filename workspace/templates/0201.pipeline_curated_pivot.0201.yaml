yaml:
  schema_version: smoking-data.pipeline.v7
  asset_code: "0201"

job:
  name: curated_pivot

output:
  artifact:
    type: curated_dataset
    root_dir: f"{data_root}/{asset_code}/{job_name}"
    format: parquet
    compression: zstd
    write_policy: atomic_replace
    physical_layout:
      profile: curated_reuse_v1
      adaptation_scope: generation_fixed
      row_group_rows: auto
  logging:
    root_dir: f"{log_root}/{asset_code}"

define_upstream:
- op: define_asset
  alias: main
  definition: 0101.source.0101.yaml
# 0101과 0103 route를 함께 사용하려면 위 단일 upstream을 아래처럼 바꾼다.
# - op: define_asset
#   alias: api_source
#   definition: 0101.source.0101.yaml
#   source_identity: {value: source_0101}
# - op: define_asset
#   alias: csv_source
#   definition: 0103.csv_unpivot_source.0103.yaml
#   select:
#     labels: {route: [group_a]}
#   source_identity: {value: source_0103}
# combine_upstream:
#   op: union_rows
#   alias: main
#   sources: [api_source, csv_source]
#   source_column: {name: upstream_source, dtype: STRING, existing_column_policy: error}
#   union_by_name: true
#   missing_columns: insert_null
#   incompatible_dtypes: error
#   duplicate_path_policy: error
# 외부 dataset을 작업 대상으로 지정하려면 위 define_asset 블록을 주석 처리하고 아래를 활성화한다.
# - op: define_dataset
#   alias: main
#   paths: [DATA/input/curated]
#   format: parquet
#   union_by_name: true
#   missing_columns: insert_null
#   incompatible_dtypes: error

build_sidecar:
  alias: select_latest
  source: main
  columns: auto
  operations:
  - op: filter
    alias: filter_valid_partition
    spotfire_expression: '[partition] Is Not Null'
  - op: add_calc
    alias: calculate_selector_key
    expressions:
    - name: row_key.normalized
      spotfire_expression: String([row_key])
  - op: active_row_selection
    method: sort_first
    group_keys:
    - name: partition
      column: partition
    - name: row_key.normalized
      column: row_key.normalized
    sort:
    - column: updated_at
      direction: desc
      nulls: last

materialize:
  alias: materialize_selected_payload
  source: main
  coordinates: select_latest
  partition_by: [partition]
  part_boundary:
    target_rows: 20000
    preserve_groups: [partition, row_key.normalized, row_key]
  workers: 1
  max_tasks_per_child: 1
  operations:
  - op: add_calc
    alias: calculate_payload
    expressions:
    - name: amount.x2
      sql: amount * 2
    - name: amount_label
      spotfire_expression: 'String([amount]) & "_units"'
  - op: rename_columns
    alias: rename_payload
    mapping:
      amount_x2: amount_double
  # 외부 Parquet lookup으로 값만 치환하려면 다음 operation을 사용한다.
  # 칼럼명 자체를 바꾸는 경우에는 위 rename_columns를 사용한다.
  # - op: reference_replace
  #   alias: replace_category
  #   source_column: category
  #   reference_parquet: resources/category_map.parquet
  #   reference_input_column: old_value
  #   reference_output_column: new_value
  # 선택 사항: lookup 기반 리스트 복원은 materialize task 안에서 가장 먼저 실행한다.
  # 실제 lookup 파일과 컬럼 계약에 맞게 수정한 뒤 주석을 해제한다.
  # - op: list_restore
  #   alias: restore_lists
  #   lookup_path: DATA/reference/list_lookup.parquet
  #   schema: auto
  #   # 타입을 고정해야 하는 경우에만 아래처럼 명시 스키마를 사용한다.
  #   # schema: {restored_value: DOUBLE[], restored_order: INTEGER[]}
  #   config:
  #     key_column: row_key
  #     order_column: restored_order
  #     value_columns: [restored_value]
  #     source_coord_columns: [partition]
  #     lookup_coord_columns: [partition]
  # JSON 배열 문자열도 대상 타입에 맞춰 Arrow List 칼럼으로 복원한다.
  # 예: '["0.005", "0.001", "0.009"]' + DOUBLE[] -> List<Float64>
  - op: type_cast
    alias: cast_amount
    columns:
    - name: amount
      type: INT64
  # - op: include_columns
  #   alias: select_output_payload
  #   columns:
  #   - partition
  #   - row_key
  #   - updated_at
  #   - metric
  #   - amount
  #   - amount.x2
  #   - amount_label
  - op: pivot
    alias: pivot_metrics
    row_keys: [partition, row_key]
    column_keys: [metric]
    value_keys:
    - name: amount
      source_column: amount
      aggregation: first
      column_name_rule: <column_key_value>__<value_key_name>
    value_keys_without_column:
    - name: latest_updated_at
      source_column: updated_at
      aggregation: max
      column_name_rule: <value_key_name>.<agg>
    first_duplicate_policy: error
    null_column_key_policy: error
    column_key_separator: __

save_dataset:
  alias: write_curated
  input: materialize_selected_payload
  partition_by: [partition]
  operations: []

execution:
  memory:
    hard_limit_mb: 4096
    safety_ratio: 0.80
    phases:
      build_sidecar:
        target_peak_memory_mb: 1536
        workers: {min: 1, max: 2}
      materialize:
        target_peak_memory_mb: 3584
        workers: {min: 1, max: 2}
      save_dataset:
        target_peak_memory_mb: 512
        workers: {min: 1, max: 1}
  max_source_files_per_task: 40
  max_source_row_groups_per_task: 512
  reset_before_run: false
  # probe·candidate·active sidecar와 physical plan은 전체 입력으로 만들고 최종 task만 제한한다.
  # 같은 root_dir의 전체 결과를 부분 dataset으로 대체하므로 테스트 전용 경로 사용을 권장한다.
  # test_run:
  #   final_task_limit: 1
