yaml:
  schema_version: smoking-data.source.v4
  asset_code: "0101"
job:
  name: public_api_ndjson
source:
  api_request:
    query_mode: http_ndjson
    sql:
      table_id: public_api_ndjson
      date_window:
        step: 1
        date_window: ['(2025-01-01, 2025-01-01)']
    http:
      url: https://example.go.kr/openapi/items
      query:
        serviceKey: ${DATA_GO_KR_SERVICE_KEY}
        from: "{date_from}"
        to: "{date_to}"
      headers:
        Accept: application/x-ndjson
      timeout_sec: 60
      batch_rows: 10000
      pagination:
        strategy: page_number
        page_parameter: pageNo
        size_parameter: numOfRows
        page_size: 1000
        max_pages: 10000
output: {}
