yaml:
  schema_version: smoking-data.csv-source.v1
  asset_code: "0103"
job:
  id: gdelt-events-latest
  name: gdelt_latest_events
source:
  transport: http_download
  download:
    discovery:
      type: gdelt_v2_masterfile
      url: https://data.gdeltproject.org/gdeltv2/masterfilelist.txt
      file_kind: events
      selection: latest
      stability_lag_minutes: 15
    timeout_sec: 60
    format: zip
    max_download_bytes: 134217728
    max_archive_members: 10
    max_extracted_bytes: 536870912
  glob: "*.CSV"
  recursive: true
  ordering: path_asc
  empty_directory_policy: error
  csv:
    encoding: utf8
    delimiter: "\t"
    quote_char: '"'
    header: false
    column_names:
    - GLOBALEVENTID
    - SQLDATE
    - MonthYear
    - Year
    - FractionDate
    - Actor1Code
    - Actor1Name
    - Actor1CountryCode
    - Actor1KnownGroupCode
    - Actor1EthnicCode
    - Actor1Religion1Code
    - Actor1Religion2Code
    - Actor1Type1Code
    - Actor1Type2Code
    - Actor1Type3Code
    - Actor2Code
    - Actor2Name
    - Actor2CountryCode
    - Actor2KnownGroupCode
    - Actor2EthnicCode
    - Actor2Religion1Code
    - Actor2Religion2Code
    - Actor2Type1Code
    - Actor2Type2Code
    - Actor2Type3Code
    - IsRootEvent
    - EventCode
    - EventBaseCode
    - EventRootCode
    - QuadClass
    - GoldsteinScale
    - NumMentions
    - NumSources
    - NumArticles
    - AvgTone
    - Actor1Geo_Type
    - Actor1Geo_FullName
    - Actor1Geo_CountryCode
    - Actor1Geo_ADM1Code
    - Actor1Geo_ADM2Code
    - Actor1Geo_Lat
    - Actor1Geo_Long
    - Actor1Geo_FeatureID
    - Actor2Geo_Type
    - Actor2Geo_FullName
    - Actor2Geo_CountryCode
    - Actor2Geo_ADM1Code
    - Actor2Geo_ADM2Code
    - Actor2Geo_Lat
    - Actor2Geo_Long
    - Actor2Geo_FeatureID
    - ActionGeo_Type
    - ActionGeo_FullName
    - ActionGeo_CountryCode
    - ActionGeo_ADM1Code
    - ActionGeo_ADM2Code
    - ActionGeo_Lat
    - ActionGeo_Long
    - ActionGeo_FeatureID
    - DATEADDED
    - SOURCEURL
    null_values: [""]
    malformed_row_policy: error
  source_file:
    output_column: file_name
    value: relative_path
    dtype: STRING
    existing_column_policy: replace_with_warning
materialize:
  operations:
  - op: type_cast
    alias: gdelt_strings
    load_as: STRING
    columns_by_type: {}
    default_type: STRING
    cast_failure_policy: error
    missing_named_column_policy: error
  - op: unpivot
    alias: gdelt_metrics
    id_columns: [GLOBALEVENTID, SQLDATE, DATEADDED, SOURCEURL, file_name]
    value_columns: remaining
    name_column: category
    value_column: value
    value_type: STRING
    preserve_nulls: false
  - op: add_calc
    alias: gdelt_keys
    expressions:
    - {name: partition, sql: SQLDATE}
    - {name: row_key, sql: GLOBALEVENTID}
    - {name: join_key, sql: GLOBALEVENTID}
    - {name: updated_at, sql: DATEADDED}
routing:
  input: gdelt_keys
  routes:
  - route_name: event_metrics
    filtering:
    - sql: "category IN ('NumMentions', 'NumSources', 'NumArticles', 'AvgTone')"
  overlap_policy: duplicate
  unmatched_policy: drop
output: {}
execution:
  target_rows_per_part: 100000
