yaml:
  schema_version: smoking-data.source.v5
  asset_code: "0101"

job:
  name: gdelt_doc_articles
  description: GDELT DOC 2.0 article-list API smoke/sample ingestion

source:
  api_request:
    query_mode: http_json
    sql:
      table_id: gdelt_doc_articles
      date_window:
        step: 1
        date_window: ['(-1, -1)']
    http:
      url: https://api.gdeltproject.org/api/v2/doc/doc
      query:
        query: climate
        mode: artlist
        maxrecords: 250
        format: json
        sort: datedesc
        startdatetime: "{date_from:%Y%m%d%H%M%S}"
        enddatetime: "{date_to:%Y%m%d%H%M%S}"
      headers:
        User-Agent: smoking-data-gdelt-source/1.0
        Accept: application/json
      timeout_sec: 60
      max_response_bytes: 16777216
      batch_rows: 1000
      pagination:
        strategy: none
      json:
        item_path: articles

execution:
  reset_before_run: false
  write_source_profile_json: false
  retryable_error_substrings: ["status=429", "status=500", "status=502", "status=503", "status=504"]
  workers: 1
  warmup_first_task: false
  worker_start_delay_sec: 0
  max_retries: 3
  retry_backoff_sec: 6

output: {}
