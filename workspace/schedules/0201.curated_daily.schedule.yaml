yaml:
  schema_version: smoking-data.schedule.v1

schedule:
  alias: curated_daily
  enabled: true
  timezone: Asia/Seoul
  cron: "0 4 * * *"

targets:
  - alias: curated
    kind: asset
    definition: ../templates/0201.pipeline_curated_pivot.0201.yaml
  - alias: joined
    kind: asset
    definition: ../templates/0301.pipeline_multi_right_join.0301.yaml
  - alias: snapshot
    kind: asset
    definition: ../templates/0401.pipeline_analysis_snapshot.0401.yaml

policy:
  misfire: catch_up_once
  timeout_minutes: 180
