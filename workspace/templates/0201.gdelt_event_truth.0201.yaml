yaml:
  schema_version: smoking-data.pipeline.v7
  asset_code: "0201"
job:
  name: gdelt_event_truth
output:
  artifact:
    type: curated_dataset
    root_dir: f"{data_root}/{asset_code}/{job_name}"
    format: parquet
    compression: zstd
    physical_layout: {profile: curated_reuse_v1, adaptation_scope: generation_fixed, row_group_rows: auto}
  logging:
    root_dir: f"{log_root}/{asset_code}"
define_upstream:
- op: define_asset
  alias: main
  definition: 0103.gdelt_latest_events.0103.yaml
build_sidecar:
  alias: select_latest_metric
  source: main
  partition_by: [partition]
  part_boundary:
    target_rows: 20000
    preserve_groups: [partition, row_key, category]
  columns: auto
  operations:
  - op: filter
    alias: valid_key
    sql: "row_key IS NOT NULL AND partition IS NOT NULL"
  - op: active_row_selection
    method: sort_first
    group_keys:
    - {name: partition, column: partition}
    - {name: row_key, column: row_key}
    - {name: category, column: category}
    sort:
    - {column: updated_at, direction: desc, nulls: last}
materialize:
  alias: materialize_truth
  workers: 1
  max_tasks_per_child: 1
  operations:
  - op: type_cast
    alias: cast_metric_value
    columns:
    - {name: value, type: FLOAT64}
  - op: include_columns
    alias: truth_columns
    columns: [partition, row_key, join_key, updated_at, category, value, SOURCEURL, file_name]
execution:
  memory:
    hard_limit_mb: 2048
    safety_ratio: 0.80
    phases:
      build_sidecar: {target_peak_memory_mb: 768, workers: {min: 1, max: 1}}
      materialize: {target_peak_memory_mb: 1536, workers: {min: 1, max: 1}}
  max_source_files_per_task: 40
  max_source_row_groups_per_task: 512
  reset_before_run: false
