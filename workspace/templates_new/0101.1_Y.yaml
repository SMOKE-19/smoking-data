yaml:
  schema_version: smoking-data.source.v5
  asset_code: "0101"

job:
  name: 1_Y

source:
  api_request:
    query_mode: structured
    adapter: spi
    # 사용자별 토큰 발급이 필요한 경우 프로젝트 루트 기준 경로를 지정한다.
    # adapter_options:
    #   pre_query_script: auth/generate_token.py
    #   timeout_sec: 60
    #   lock_timeout_sec: 60
    sql:
      table_id: basic_source
      select:
      - name: text_li
      - name: text_pr
      - name: bucket
        expr: LEFT(text_ro, 3)
      - name: text_ro
      - name: int_wa
        expr: CAST(int_wa AS INTEGER)
      - name: text_st
      - name: text_te
      - name: integer_go
      - name: integer_ne
      - name: text_pg
      - name: datetime_tk
      - name: updated_at
      filters:
        common:
        - text_li = 'LI_1'
        - text_pr = 'PR_A'
        - text_st IN ('ST_1', 'ST_2', 'ST_3')
        # sub_job:
        # - sub_job_name: text_1_a
        #   sub_job_filtering:
        #   - text_1 LIKE 'A%'
        # - sub_job_name: text_1_b
        #   sub_job_filtering:
        #   - text_1 LIKE 'B%'
      date_window:
        column: datetime_tk
        step: 30
        date_window:
        - '(-7, 0)'
        # - '(2025-01-02, 2025-01-02)'
execution:
  reset_before_run: false
  write_source_profile_json: false
  retryable_error_substrings: []
  data_api_print_capture:
    rules:
      enabled: false
      fields:
      - field: api_print_full_text
        enabled: true
        capture: full_text
      - field: api_execution_time_sec
        enabled: true
        capture: regex
        regex: '(?im)>>time:\\s*(?:(\\d+)\\s*min\\s+)?([0-9]+(?:\\.[0-9]+)?)s'
      - field: api_rows
        enabled: true
        capture: regex
        regex: '(?im)(?:rows:\\s*|the\\s+total\\s+number\\s+of\\s+rows\\s+in\\s+exported\\s+output:\\s*)([0-9]+)'
      - field: api_dataset_parts
        enabled: true
        capture: regex
        regex: '(?im)count\\s+of\\s+output:\\s*([0-9]+)'
  workers: 1
  warmup_first_task: false
  worker_start_delay_sec: 5.0
  max_retries: 5
  retry_backoff_sec: 1.0
  # 테스트 시 전체 window를 계획한 뒤 첫 source task 하나만 실행한다.
  # 같은 root_dir의 전체 결과를 대체할 수 있으므로 테스트 전용 경로 사용을 권장한다.
  # test_run:
  #   final_task_limit: 1
output:
  artifact:
    type: source_dataset
    root_dir: f"{data_root}/{asset_code}/{table_id}_{job_name}"
    format: parquet
    compression: zstd
    physical_layout:
      profile: source_ingest_v1
      adaptation_scope: generation_fixed
      row_group_rows: 1000
    file_name_rule:
      raw_dataset: "<job_name>_<sub_job_suffix>__<date_from>-<date_to>"
    parquet_writer:
      index: false
      engine: pyarrow
      write_page_index: true
      write_statistics: true
      data_page_size: 1048576
      max_rows_per_page: 1000
      # 카디널리티가 낮은 칼럼만 선택하려면 예: [text_1, text_2]
      use_dictionary: false
    publication:
      enabled: true
      target: analytics_s3
      dataset_prefix: assets/0101/basic_source_1_Y
      mode: mirror_after_local_commit
      failure_policy: required
      parquet:
        enabled: true
        random_access_index:
          level: key
          key_columns: [bucket, text_ro, int_wa, text_st]
          planning_columns: [datetime_tk, text_te, updated_at]
  logging:
    root_dir: f"{log_root}/{asset_code}/{table_id}"
    file_name_rule:
      logging: f"{job_name}.jsonl"
