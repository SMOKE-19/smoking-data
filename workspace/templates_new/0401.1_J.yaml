yaml:
  schema_version: smoking-data.pipeline.v8
  asset_code: "0401"

job:
  name: 1_J

output:
  artifact:
    type: analysis_snapshot
    root_dir: f"{data_root}/{asset_code}/{job_name}"
    format: sbdf
    sbdf:
      row_key_columns: [bucket, text_ro, int_wa]
      batch_size: 50000
      encoding_rle: true
    physical_layout:
      profile: analysis_snapshot_adaptive_v1
      adaptation_scope: task_adaptive
      row_group_rows: 1000
    # 로컬 SBDF atomic commit 후 analytics_s3에도 SBDF 데이터 표현만 게시한다.
    # SBDF key index sidecar는 random access 메타데이터이며 Parquet 데이터 표현이 아니다.
    # 실제 bucket/profile은 .smoking-data/object-stores.yaml의 analytics_s3에서 설정한다.
    publication:
      enabled: true
      target: analytics_s3
      dataset_prefix: assets/0401/1_J
      mode: mirror_after_local_commit
      failure_policy: required
      parquet:
        enabled: false
      sbdf:
        # artifact.sbdf.row_key_columns로 최종 output key sidecar를 생성해 함께 게시한다.
        enabled: true
  logging:
    root_dir: f"{log_root}/{asset_code}"

define_upstream:
# 외부 dataset을 작업 대상으로 지정하려면 위 define_asset 블록을 주석 처리하고 아래를 활성화한다.
# - op: define_dataset
#   alias: joined_metrics
#   paths: [DATA/input/analysis/joined_metrics]
#   format: parquet
#   union_by_name: true
#   missing_columns: insert_null
#   incompatible_dtypes: error
- op: define_asset
  alias: joined_metrics
  definition: 0301.1_J.yaml

# thin sidecar에서 최종 grain별 대표행 좌표만 선택한다.
# 0401은 출력 partition_by를 노출하지 않으며 이 경계는 coordinate task 분할에만 사용된다.
build_sidecar:
  alias: select_snapshot_rows
  source: joined_metrics
  columns: auto
  part_boundary:
    target_rows: 20000
    target_key_groups: 500
    preserve_groups: [bucket, text_ro, int_wa]
  operations:
  - op: filter
    alias: filter_valid_partition
    spotfire_expression: '[bucket] Is Not Null'

# build_sidecar가 선택한 coordinate만 읽어 최종 분석 축을 완결하고 snapshot.sbdf로 커밋한다.
materialize:
  alias: materialize_snapshot_input
  workers: 1
  max_tasks_per_child: 1
  operations:
  # materialize 입력 스키마의 모든 LIST/LargeList 칼럼을 자동 탐색해 같은 위치끼리 펼친다.
  # 각 행에서 모든 LIST 칼럼의 원소 수가 다르면 list.shape_mismatch로 실패한다.
  - op: unnest
    alias: explode_all_list_columns
    max_elements_per_row: 1024


execution:
  memory_budget_mb: 4096
  max_source_files_per_task: 40
  reset_before_run: false
