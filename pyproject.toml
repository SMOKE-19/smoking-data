[project]
name = "smoking-data"
version = "0.1.4"
description = "Asset-oriented local data production engine."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "boto3>=1.40.0,<2.0.0",
    "duckdb>=1.5.0,<2.0.0",
    "fastparquet",
    "pandas",
    "polars>=1.31.0,<2.0.0",
    "pyarrow>=16.0.0,<24.0.0",
    "PyYAML>=6.0.3,<7.0.0",
    "smoking-sbdf>=0.1.6,<0.2.0",
]

[project.scripts]
smoking-data = "smoking_data.cli:main"

[tool.uv]
find-links = [
    "https://github.com/SMOKE-19/smoking-sbdf/releases/expanded_assets/v0.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "ruff>=0.8",
]

[build-system]
requires = [
    "setuptools>=82",
    "setuptools-rust>=1.11",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "smoking_data*",
    "smoking_data_engine_rs*",
    "spotfire_expr_normalizer*",
]

[tool.setuptools.package-data]
smoking_data = [
    "assets/contract.yaml",
    "assets/a0101_source/contract.yaml",
    "assets/a0201_curated/contract.yaml",
    "assets/a0301_join/contract.yaml",
    "assets/a0401_snapshot/contract.yaml",
]
smoking_data_engine_rs = ["*.pyi", "py.typed"]
spotfire_expr_normalizer = ["data/*.sqlite", "data/*.md"]

[[tool.setuptools-rust.ext-modules]]
target = "smoking_data_engine_rs.smoking_data_engine_rs"
path = "native/engine/Cargo.toml"
binding = "PyO3"
debug = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
