yaml:
  schema_version: smoking-data.pipeline.v6
  asset_code: "0301"

job:
  name: 1_J

output:
  artifact:
    type: joined_dataset
    root_dir: f"{data_root}/{asset_code}/{job_name}"
    format: parquet
    compression: zstd
    physical_layout:
      profile: joined_reuse_v1
      adaptation_scope: generation_fixed
      row_group_rows: auto
    publication:
      enabled: true
      target: analytics_s3
      dataset_prefix: assets/0301/1_J
      mode: mirror_after_local_commit
      failure_policy: required
      parquet:
        enabled: true
        random_access_index:
          level: key
          key_columns: [bucket, text_ro, int_wa]
  logging:
    root_dir: f"{log_root}/{asset_code}"

define_upstream:
# - op: define_dataset
#   alias: source_main
#   paths: [DATA/parity/join/left]
#   format: parquet
#   union_by_name: true
# 관리형 upstream이면 위 define_dataset을 주석 처리하고 아래를 활성화한다.
- op: define_asset
  alias: source_main
  definition: 0201.1_Y.yaml

- op: define_asset
  alias: source_profile
  definition: 0201.2_B.yaml

- op: define_asset
  alias: source_category
  definition: 0201.3_M.yaml

build_sidecar:
  alias: join_keyspace
  method: union_distinct_keys
  sources: [source_main, source_profile, source_category]
  keys: [bucket, text_ro, int_wa]
  partition_by: [bucket]
  part_boundary:
    target_rows: 20000
    target_key_groups: 500
    preserve_groups: [bucket, text_ro, int_wa]
  null_key_policy: error

materialize:
  alias: materialize_selected_payload
  workers: 1
  max_tasks_per_child: 1
  operations:
  # join 오른쪽 payload 칼럼 선택 규칙:
  # - include_columns/exclude_columns를 모두 생략하면 join key를 제외한 오른쪽 칼럼을 모두 사용한다.
  # - list는 정확한 칼럼명 목록, 단일 string은 정규식으로 해석한다.
  # - include를 먼저 적용한 뒤 exclude를 적용한다.
  # - join key는 include와 무관하게 내부 입력에 유지되며, exclude로 join key를 제거하면 오류가 발생한다.
  # - `auto`는 특별한 예약어가 아니므로 전체 칼럼 선택 용도로 사용하지 않는다.
  # 예: include_columns: [metric_a, metric_b]
  # 예: include_columns: '^metric_.*$'
  # 예: exclude_columns: [debug_text, raw_payload]
  # 예: exclude_columns: '^(debug_|raw_)'
  - op: join
    alias: join_main
    input_right: source_main
    left_on: [bucket, text_ro, int_wa]
    right_on: [bucket, text_ro, int_wa]

  - op: join
    alias: join_profile
    input_right: source_profile
    left_on: [bucket, text_ro, int_wa]
    right_on: [bucket, text_ro, int_wa]

  - op: join
    alias: join_category
    input_right: source_category
    left_on: [bucket, text_ro, int_wa]
    right_on: [bucket, text_ro, int_wa]

execution:
  memory_budget_mb: 4096
  reset_before_run: true
  # left/right index와 physical plan은 전체 입력으로 만들고 최종 join task만 제한한다.
  # 같은 root_dir의 전체 결과를 부분 dataset으로 대체하므로 테스트 전용 경로 사용을 권장한다.
  # test_run:
  #   final_task_limit: 1
